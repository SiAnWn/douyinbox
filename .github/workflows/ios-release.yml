name: iOS Build (unsigned)

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  build-unsigned:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned .app and package IPA
        run: |
          set -euo pipefail
          xcodebuild build \
            -project DouyinBox.xcodeproj \
            -scheme DouyinBox \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO
          APP=build/DD/Build/Products/Release-iphoneos/DouyinBox.app
          test -d "$APP"
          rm -rf build/pkg && mkdir -p build/pkg/Payload
          cp -R "$APP" build/pkg/Payload/
          ( cd build/pkg && zip -qr ../DouyinBox-unsigned.ipa Payload )
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: DouyinBox-unsigned
          path: build/DouyinBox-unsigned.ipa
