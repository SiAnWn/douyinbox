name: DouyinBox
options:
  bundleIdPrefix: com.sian
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  openhongguo:
    url: https://github.com/beilunyang/openhongguo.git
    from: 0.3.0
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.3.62"
    CURRENT_PROJECT_VERSION: "78"
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  DouyinBoxShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Share
      - path: App/IslandKit.swift
      - path: App/Models.swift
      - path: App/DouyinAPI.swift
      - path: App/Engines.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sian.DouyinBox.share
        PRODUCT_NAME: DouyinBoxShare
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) ISLANDAPP
        SKIP_INSTALL: YES
    info:
      path: Generated/ShareInfo.plist
      properties:
        CFBundleDisplayName: 鎶栭煶鐩掑瓙
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareRootViewController
          NSExtensionActivationRule:
            NSExtensionActivationSupportsWebURLWithMaxCount: 1
            NSExtensionActivationSupportsTextWithMaxCount: 1
  DouyinBoxIsland:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widget
      - path: App/IslandKit.swift
      - path: App/Models.swift
      - path: App/DouyinAPI.swift
      - path: App/Engines.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sian.DouyinBox.island
        PRODUCT_NAME: DouyinBoxIsland
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) ISLANDAPP
        SKIP_INSTALL: YES
    info:
      path: Generated/IslandInfo.plist
      properties:
        CFBundleDisplayName: 鎶栭煶鐩掑瓙鐏靛姩宀?        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  DouyinBox:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - App
    dependencies:
      - target: DouyinBoxIsland
      - target: DouyinBoxShare
      - package: openhongguo
        product: Openhongguo
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: 鎶栭煶鐩掑瓙
        CFBundleDevelopmentRegion: zh_CN
        NSFaceIDUsageDescription: 鐢ㄤ簬瑙ｉ攣绉佸瘑瑙嗛
        NSSupportsLiveActivities: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIBackgroundModes:
          - background-transfer
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
